  compatibility_effect: P2 visual until those systems exist.
  user_visible: true

- id: DEV-020
  subsystem: particles
  vanilla_behavior: >
    EffectRenderer with about 40 particle types: block break and mining
    flecks, sprinting dust, random display ticks (torches, furnaces, fire,
    lava, drips, water motes, mycelium, redstone, portals, ender chests,
    leaves in rain), entity and weather effects (bubbles, splashes, rain,
    explosions, crits, potions, hearts, villagers, notes, enchanting), the
    Particles option, a 16-block spawn range and 4000 per texture.
  replica_behavior: >
    ParticleManager reproduces the block flecks (64 per broken or popped
    block, one per tick while mining), sprinting dust, and the display
    ticks of torches, redstone torches, lit furnaces, fire, lava (pops and
    drips), water (motes and drips) and mycelium, the bubbles and droplets
    of a player or dropped item falling into water (items count as in water
    only while 0.15-0.6 into a block, so a sinking item splashes again as it
    passes each block), and flames on burning items (lava makes items hop,
    burn and vanish on their second tick in it), with the Particles option,
    range and cap (HYPOTHESIS: recalled textures, lifetimes and motion).
    Particles draw after all terrain, so they show through water where
    vanilla draws water over them. NOT DONE: entity, weather, explosion,
    potion and portal particles, fall-landing dust and the per-block
    particle gravity values. (Water currents now push items and
    players, DEV-022.)
  reason: >
    The missing kinds belong to systems (entities, weather, damage, water
    physics) that do not exist yet.
  compatibility_effect: P2 visual.
  user_visible: true

- id: DEV-021
  subsystem: player_movement
  vanilla_behavior: >
    EntityPlayerSP/EntityPlayer/EntityLivingBase movement at 20 ticks a
    second: ground push 0.1 x 0.16277136 / f^3 with f = 0.91 x slipperiness,
    air push 0.02 (+30% sprinting), 0.08 gravity with 0.98 drag, 0.42 jump
    with a 0.2 sprint boost, sprint by key or double-tapped forward, sneak
    at 0.3 input with edge safety, water and lava (0.02 push, 0.8/0.5 drag,
    0.02 sink, +0.04 per tick holding jump, 0.3 hop onto ledges), ladders
    and vines, creative flight, soul sand, cobwebs and slime; plus water
    currents, fall damage, hunger exhaustion, Depth Strider, Speed/Slowness/
    Jump Boost and the 1.8 step rule's second (low ceiling) path.
  replica_behavior: >
    Player ticks with the recalled rules above (HYPOTHESIS), giving 4.317 m/s
    walking, 5.612 sprinting, 1.31 sneaking, about 7 sprint-jumping, a
    1.2492-block jump (1.8 zeroes motion under 0.005), and 10.9 m/s flight
    (PlayerMovementTest); the world is drawn between ticks; water currents
    push a player who is not flying by 0.014 a tick (DEV-022). Speed and
    Slowness scale walking speed, Jump Boost raises jumps and safe falls
    (DEV-034), but the view doesn't widen or narrow with speed. NOT DONE:
    the low-ceiling step path. Fall damage and hunger exhaustion are done
    (DEV-029, DEV-032).
  reason: >
    The FOV change waits for the renderer's FOV modifier; the step path is rare.
  compatibility_effect: P2 until damage, hunger and water flow exist.
  user_visible: true

- id: DEV-022
  subsystem: liquids, animated textures and burning
  vanilla_behavior: >
    Scheduled block ticks saved per chunk (TileTicks), BlockDynamicLiquid and
    BlockStaticLiquid spreading (water every 5 ticks, lava every 30, 10 in
    the Nether), lava random ticks that set fire to nearby flammable
    blocks, the fizz sound, BlockFluidRenderer surfaces, water currents
    pushing entities, buckets, animated block textures from .mcmeta, and a
    burning player's fire timer.
  replica_behavior: >
    World keeps a pending-tick queue (due time, priority, order; one entry
    per position and block; up to 1000 run per tick) and LiquidFlow
    replays the recalled BlockDynamicLiquid rules (spread, falling, nearest
    drop within 4, infinite water, lava hardening to obsidian, cobblestone
    and stone, washing away non-solid blocks with drops); FluidMesher draws
    the recalled BlockFluidRenderer surfaces; buckets scoop sources and pour
    them; TextureAtlas animates every .mcmeta sprite once per client tick
    (HYPOTHESIS throughout, LiquidFlowTest, FluidMesherTest,
    TextureAtlasTest). Pending ticks are saved in one ticks.lct file per
    world rather than per chunk. In Creative the player's fire never burns
    down, only water puts it out (reported from vanilla 1.8.9 play; the
    mechanism is UNKNOWN). NOT DONE: lava igniting blocks (no random
    block ticks yet; fire itself spreads and burns out, DEV-026), and the liquid
    tick skipping chunks whose neighbours are not loaded (only the tick's
    own chunk is checked, so a flow reaching the edge can generate new
    chunks).
  reason: >
    Fire behaviour and dimensions are separate systems not built
    yet; one tick file keeps the chunk format unchanged.
  compatibility_effect: >
    P2: water and lava flow and look as recalled; lava cannot start fires.
  user_visible: true

- id: DEV-023
  subsystem: sound
  vanilla_behavior: >
    paulscode SoundSystem through LWJGL 2's OpenAL, with every sound event of
    sounds.json played by blocks, entities, weather, mobs, GUIs, records and
    the MusicTicker; positional sounds fade linearly over 16 blocks (16 x
    volume when louder); all sounds pause with the game.
  replica_behavior: >
    SoundSystem plays Ogg files straight through LWJGL 3 OpenAL and
    stb_vorbis (music streamed), 28 channels plus 2 for music, linear fade
    to the same range, category and master sliders applied live, and pause
    and resume with the game. Sounds wired so far (HYPOTHESIS: recalled
    volumes, pitches and timing): button clicks; block break, place and
    mining-hit sounds from BlockSoundType (per-block sets recalled and
    inferred from materials); footsteps (every 1/0.6 blocks walked, silent
    sneaking or flying) and swimming; splashes of the player and items;
    fizzing (lava meeting water, items hopping in lava, fire put out by
    water); item pickup pops; tool breaking; fire, flowing water, lava and
    portal ambience; cave ambience; and title, survival, creative and Nether music
    (MusicTicker). NOT DONE: sounds of systems that don't exist yet (mobs,
    damage and falls, doors, chests, buttons and levers, pistons, note
    blocks, records, weather, explosions, eating, bows, XP), End
    music, the "Unsupported sound" warnings, and sound events whose files
    have capital letters (resource names are lower-cased).
  reason: >
    The sounds belong to systems that are still to come; the backend is
    LWJGL 3 because LWJGL 2 and paulscode are not used.
  compatibility_effect: P2 audio.
  user_visible: true

- id: DEV-024
  subsystem: crafting
  vanilla_behavior: >
    CraftingManager's recipe list (shaped recipes placed anywhere in the
    grid and mirrored, shapeless recipes, blocks given as ingredients
    accepting every variant) plus special recipes: tool and armour repair,
    armour dyeing, fireworks and firework stars, banners and banner
