  reason: >
    Those triggers belong to later systems; offline play has no player id.
  compatibility_effect: >
    P2: only the early crafting achievements can be earned in play;
    /achievement reaches the rest.
  user_visible: true

- id: DEV-026
  subsystem: fire, flint and steel, nether portals
  vanilla_behavior: >
    Flint and steel lights fire beside the block clicked (fire.ignite, one
    durability). Fire (BlockFire) ticks every 30-39 ticks while doFireTick
    is on: it ages, spreads to and burns flammable blocks by their
    encouragement and flammability (faster at higher difficulty, slower in
    humid biomes), goes out without fuel or in rain, burns forever on
    netherrack, primes TNT it burns, and hangs on flammable walls. Fire lit
