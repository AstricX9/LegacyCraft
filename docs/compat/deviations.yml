- id: DEV-040
  subsystem: dedicated server
  vanilla_behavior: >
    The 1.8.9 dedicated server runs the whole game for its players: survival
    mining with drops and server-checked dig time, an authoritative
    inventory and containers, mobs, combat, damage and respawning,
    dimensions, player data saved per UUID, online-mode authentication and
    the full command set.
  replica_behavior: >
    PARTIAL. net.minecraft.server.dedicated speaks protocol 47 in offline
    mode (handshake, server-list ping, login with compression) and serves
    the LegacyCraft overworld. Chunks stream around each player, block
    changes reach everyone, players see each other move, sneak, sprint,
    swing and what they hold and wear, and chat works.
    Survival: the server owns the inventory (window 0 and the crafting
    table's 3x3 window; clicks, shift-clicks, number keys, drags, double
    clicks and the drop key are applied with the shared inventory rules and
    the window is resent after each click), digging is timed against the
    held tool (0.7 tolerance, counted in ticks or wall time, whichever is
    longer) and drops items that are tracked, picked up and thrown; tools
    wear; placing uses up the held item; hunger, natural regeneration,
    starving, fall damage, the void, eating food and cake, putting on armour,
    death (everything dropped, death message) and respawning at the world
    spawn. Player position, game mode, health, hunger and inventory are
    saved in <world>/playerdata/<uuid>.dat; the time of day in server.dat.
    Commands: /list, /seed, /gamemode, /spawn, /kill.
    Mobs: hostile mobs (zombies, skeletons, creepers, spiders) spawn around
    every player with the singleplayer rules (DEV-035's spawn cycle over the
    chunks within 8 of any player, kept 24 blocks from every player), and
    sheep, pigs, chickens and cows every 400 ticks; server.properties'
    spawn-monsters and spawn-animals turn either off. Mobs target the
    nearest suitable player, hurt them through armour with difficulty
    scaling ("was slain by"), knock them back, shoot arrows and blow up
    (blocks break and drop, clients get the explosion packet with their
    push). Players hit mobs with the singleplayer weapon rules (critical
    hits, Sharpness, Knockback, Fire Aspect, Looting, tool wear). Clients
    see mobs and arrows spawn, move, turn their heads, flash when hurt,
    die, burn and swell, and hear their sounds.
    NOT DONE: PvP, right-clicking mobs (shearing, breeding, saddles),
    experience orbs (none are made), mobs saved with the world, mobs only
    ticking near players, furnaces, chests and other containers (the
    client has none yet either), buckets, flint and steel, bows, potions,
    beds, the Nether, item merging on the ground, and the LegacyCraft
    client cannot connect yet (DEV-013).
    Online-mode authentication is not planned.
  reason: >
    Multiplayer is built server-first: a stock 1.8.9 client checks the wire
    format while the rest of the simulation moves behind the server.
  compatibility_effect: >
    P1: friends can play basic Survival together (mine, craft, build, eat,
    fight mobs, die) on a LegacyCraft server; mobs vanish when it restarts.
  user_visible: true

- id: DEV-041
  subsystem: additions (optional features)
  vanilla_behavior: >
    1.8.9 has no optional gameplay, graphics or interface changes beyond its
    own Options screens, and its title screen has no button between
    Minecraft Realms and Options.
  replica_behavior: >
    LegacyCraft has Additions: optional changes listed in
    assets/legacycraft/additions.json, grouped as Gameplay, Graphics,
    Interface, Accessibility and Launcher. Game additions are switched per
    instance and saved to additions.txt in the game folder (id:true|false
    lines, unknown lines kept); every one is off unless switched on, which is
    the "Faithful" look and plays as plain 1.8.9. "Recommended" turns on
    Toggle Sprint and Coordinates; anything else is "Custom". So far: Toggle
    Sprint, Toggle Sneak, Full Bright (the lightmap as under Night Vision),
    Coordinates and FPS Counter (top corners, hidden while F3 is open), No
    Damage Tilt (the hurt roll; the death tilt stays), Steady Field of View
    (no sprint/flight/potion FOV change; water still narrows it) and Solid
    Crosshair (white with a dark outline instead of the inverting blend).
    The title screen has an Additions button under Minecraft Realms, which
    moves Options, Quit and the language button down one row (and the whole
    column up on windows too short for it); it opens a screen with the look,
    a tab per category and a switch per addition. The launcher edits the
    same file per instance, and has its own additions (Remember Tab, What's
    New, Look on Instances) that apply to every instance.
  reason: >
    Requested: players choose how faithful the game looks, from plain 1.8.9
    up, without a separate modded build.
  compatibility_effect: >
    None while every addition is off, apart from the extra title-screen
    button. Additions only change the local client; servers and saves are
    unaffected.
  user_visible: true
