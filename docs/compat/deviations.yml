    map and book copying, the enchanted golden apple. Smelting is DEV-028.
  reason: >
    Special recipes need item NBT (colours, patterns, map data) that items
    don't carry yet.
  compatibility_effect: P2 until the special recipes exist.
  user_visible: true

- id: DEV-025
  subsystem: achievements
  vanilla_behavior: >
    34 achievements (AchievementList) earned in a tree, each only once its
    parent is; the pop-up in the top-right ("Achievement get!"), the chat
    line "<player> has just earned the achievement [name]", the standing
    "Press E" hint for new players, the achievement map from the pause menu
