    (HYPOTHESIS; groups stand for vanilla's wildcard metadata) and
    CraftingManager matches them the same way, sorted shaped before
    shapeless and larger first, with tool/armour repair built in. Both grids
    craft; right-clicking a crafting table opens the 3x3 screen (not while
    sneaking with an item), which closes beyond 8 blocks or when the table
    goes. Result slot clicks, shift-click, number keys and the drop key
    follow the recalled Container rules, including the right-click half and
