# Open questions blocking full 1.8.9 fidelity. Format per master context §89.
# Add an entry the moment a HYPOTHESIS is coded against; never leave it silent.

- question: >
    What is vanilla 1.8.9's exact overworld terrain algorithm (noise octaves,
    biome-driven height/volatility fields, cave/ravine carving, decoration
    pass order)?
  why_it_matters: >
    World.generate() now runs a clean-room reimplementation of the whole
    pipeline (DEV-001). Only the biome map is verified; the density terrain
    matched about 21% of the oracle world's column heights before the float
    fixes in this pass, and the surface, carvers and population are coded
    from recall.
  current_hypothesis: >
    HYPOTHESIS, recalled from 1.8.9 (ChunkProviderGenerate, the biome
    genTerrainBlocks overrides, MapGenCaves, MapGenRavine, BiomeDecorator and
    the WorldGen* features), with each Random draw in its original order.
    Specific recalls that are least certain: WorldGenVines setting the vine
    face toward its support (the code here does); mesa biomes adding 20 gold
    veins at y 32-80 in 1.8.9 (included); the spruce (Taiga2) accepting
    farmland under it; the swamp puddle and mesa band noises sampling the
    transposed (z, x) coordinates vanilla passes to the biome hook; the
    decorator ore order dirt, gravel, diorite, granite, andesite.
  evidence: >
    Self-consistency only (TerrainGenerationTest, WorldGenerationGoldenTest).
  vanilla_test_needed: >
    Re-run VanillaTerrainTest for the density field, then compare whole
    chunks (block and metadata) of the oracle world against ChunkGenerator
    for the terrain stage and against a populated region for decoration.
  owner: unassigned
  status: open

- question: >
    How does vanilla 1.8.9 place biomes (the GenLayer zoom/erosion chain),
    and are the per-biome numbers in data/mc189/biomes right?
  why_it_matters: >
    Biome placement decides the whole look of a seed, and each biome's
    depth/scale feeds terrain height. The per-biome
    temperature/rainfall/depth/scale/decoration numbers are HYPOTHESIS from
    1.8-era documentation; the colour behaviour is checked (BiomeColorsTest),
    which indirectly confirms temperature and rainfall for the biomes it
    covers. The nether/end biomes are not in the table yet.
  current_hypothesis: >
    ANSWERED for placement: the chain is island, fuzzy zoom, add-island
    erosion, climate categories (snow/cool-warm/heat-ice/special), two
    zooms, mushroom and deep-ocean passes, biome pick, two zooms, biome
    edges, hills (fed by the river-init field), rare biomes, four zooms with
    an add-island after the first and a shore after the second, smooth,
    river mix, Voronoi zoom — each layer with its own fixed base seed.
    Still HYPOTHESIS: the per-biome depth/scale/decoration numbers. The
    mutated biomes now follow vanilla's derivation (BiomeGenMutated adds 0.1
    to depth and 0.2 to scale; savanna M and ice spikes have their own
    rules; mega spruce taiga has temperature 0.25), and ice spikes have a snow
    surface; the data files had copied their base biome's numbers.
  evidence: >
    VERIFIED_VANILLA (tier 0) for placement: VanillaBiomeMapTest seeds the
    chain with the oracle world's seed (-412575085214022153) and reproduces
    the biome byte the real 1.8.9 server stored for 160000/160000 columns
    across 625 chunks.
    Supplied colour maps (tier 1) plus the documented biome colours reproduce
    exactly for plains, desert, forest, jungle, taiga, ice plains and extreme
    hills, so those temperature/rainfall pairs are right.
  vanilla_test_needed: >
    Still open for the numbers: check depth/scale against observed terrain
    heights per biome once vanilla terrain noise is implemented, and add the
    nether/end biomes.
  owner: unassigned
  status: partly answered — placement verified, per-biome numbers open

- question: >
    Are the block legacy IDs in data/mc189/blocks.json actually correct for
    a real vanilla 1.8.9 client (not just cross-checked wiki mirrors)?
  why_it_matters: >
    data/mc189/blocks.json is tagged COMMUNITY_CORROBORATED (two independent
    wiki sources agree), not VERIFIED_VANILLA. The master doc's evidence
    hierarchy (source_policy.md) puts black-box observation of the real
    client above any wiki. generateGameData now derives block registry IDs
    directly from this file (deviations.yml DEV-002, resolved half), so an
    error here would silently propagate into every block ID in the game.
  current_hypothesis: >
    High confidence. The table is internally contiguous (0-197, no gaps),
    two independently maintained wiki mirrors agree exactly, and a full scan
    of a real 1.8.9 server world (40,960,000 blocks) found no ID outside the
    table. What is still unproven is the name attached to each ID, since a
    save stores numbers only; that needs a placed-block check per ID.
  evidence: >
    minecraft.wiki and minecraft.fandom.com Pre-flattening/Block_IDs pages
    (see docs/reference_sources.md); IDs 198+ deliberately excluded as
    post-1.8.9 content per master context §97.
  vanilla_test_needed: >
    Spot-check a handful of IDs (e.g. via /give <id> in a real 1.8.9 client,
    or inspecting a real 1.8.9 world's region file with a hex/NBT viewer)
    to promote the tag to VERIFIED_VANILLA.
  owner: unassigned
  status: open

- question: >
    What is vanilla 1.8.9's per-block metadata/data-value layout (which bits
    encode orientation, variant, growth stage, slab half, wool color, etc.),
    and how should that be layered onto the existing block-ID storage?
  why_it_matters: >
    Metadata decides stairs facing, slab half, log axis, wool color, crop
    growth stage and every other variant. A wrong bit layout would render
    and save the wrong block, and would break real NBT/Anvil and protocol
    interoperability (§11.4, §12, §15.1).
  current_hypothesis: >
    IMPLEMENTED AS HYPOTHESIS: `data/mc189/block_states/` holds a
    bit-layout table for all 198 blocks (authored from 1.8.x data-value
    documentation, not yet cross-checked line by line), consumed by
    BlockStateDefinition; model lookup, worldgen and placement all use it
    (deviations.yml DEV-002). What IS verified: every decodable state of
    every block maps to a variant the supplied 1.8.9 blockstate files define
    (BlockStateModelMappingTest), and every supplied blockstate file except
    item_frame is reachable — so property names and value spellings match
    vanilla. What is NOT verified: which raw metadata value means which
    property value (e.g. torch 1=east, stairs 0=east, door lower-half
    facing order, mushroom-block 11-13 fallback, invalid-value fallbacks),
    and the default state of each block.
  evidence: >
    Supplied 1.8.9 blockstates (tier 1) for names/values; spot checks in
    BlockStateDefinitionTest encode the HYPOTHESIS layouts.
  vanilla_test_needed: >
    Cross-check every table entry against the archived pre-flattening
    data-value pages, then place/setblock each metadata in a real 1.8.9
    client and compare the rendered orientation (screenshot corpus, §85).
  owner: unassigned
  status: partially resolved

- question: >
    Which exact rules does vanilla 1.8.9 use for the neighbour-derived
    ("actual") block properties and for orienting a block on placement?
  why_it_matters: >
    The block classes (actualState, placements) implement these as behavioural
    HYPOTHESIS. Specific doubts: fences/walls attaching to glass-material
    full cubes (glowstone, sea lantern: treated as NOT attaching); stems
    bending to a fruit at any age (implemented) vs only at age 7; the door
    hinge rule's left/right convention; torch/ladder support fallbacks when
    the clicked face cannot hold them; redstone dust attachment to every
    power source; tripwire-hook "suspended" using opaque-cube below. The
    stair shape rule and the top-half left/right mirror ARE verified by
    geometry against the supplied assets (StairShapeGeometryTest).
  current_hypothesis: >
    HYPOTHESIS as implemented in the net.minecraft.block classes, but the
    support rules are now checked against a real 1.8.9 world: every one of
    7.5M placed blocks satisfies them (VanillaStateRulesTest), which also
    exercises the metadata those rules read. That comparison already
    corrected the vine rule. Still unchecked: placement orientation (nothing
    in a generated world records how a player would have placed it) and the
    neighbour-derived properties, which vanilla does not store.
  evidence: >
    VanillaStateRulesTest over a 1.8.9 server world; asset geometry for stairs
  vanilla_test_needed: >
    Build each neighbour configuration in a real 1.8.9 client and compare
    screenshots; place each orientable block from each face/yaw and read
    back the metadata (F3 or a region-file dump).
  owner: unassigned
  status: open

