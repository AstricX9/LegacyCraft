- question: >
    How does 1.8.9 pick among weighted blockstate variants (per-position
    seed and weighted selection) and how does uvlock remap faces that
    declare explicit UVs?
  why_it_matters: >
    Random grass/stone/dirt texture rotations are visible everywhere.
    WeightedModel#positionSeed implements a remembered coordinate hash and
    selection (HYPOTHESIS); ModelBaker's uvlock recomputes UVs from world
    position, which is exact for faces using default UVs but unverified for
    faces with explicit UVs.
  current_hypothesis: HYPOTHESIS as implemented in WeightedModel / ModelBaker
  evidence: none captured yet
  vanilla_test_needed: >
    Screenshot a flat grass/stone field at known coordinates in vanilla and
    compare per-block rotations; compare uvlocked stairs/fences side by side.
  owner: unassigned
  status: open

- question: >
    What are vanilla 1.8.9's item numeric IDs (256+ for standalone items;
    block-items reuse their block ID), and how do they map onto the
    supplied resource pack's item model filenames?
  why_it_matters: >
    Larger than originally scoped. ItemRegistry still assigns IDs by sorted
    `models/item` filename order. Investigating this surfaced that the
    supplied asset pack (identified by its own version.json as genuinely
    extracted from the real 1.8.9 client — id "1.8.9", releaseTime
    2015-12-03 — via the community "minecraft-assets" extraction project)
    does NOT name its item model files after vanilla's legacy item names
    1:1. Spot-checked: the model file `oak_door.json` contains texture path
    "items/door_wood" (the genuine legacy 1.8.9 texture path) but vanilla's
    real item name for that item is `minecraft:wooden_door` (item ID 324
    per the pre-flattening Item IDs table) — the extraction tool renamed
    the *file*, not the in-game identity. Blockstate files were NOT
    affected (confirmed: `blockstates/wooden_door.json` exists with the
    correct legacy name; that's why DEV-002's block-ID half was safe to
    ship as a bare filename lookup). Worse, several item model files exist
    purely as per-metadata-variant icons for a single shared vanilla item
    ID — e.g. `granite.json`, `diorite.json`, `andesite.json`,
    `smooth_granite.json` are four separate model files but ONE vanilla
    item (`minecraft:stone`, metadata 1-6); same pattern for
    `coarse_dirt`/`podzol` (`minecraft:dirt` metadata), and very likely
    every per-color wool/carpet/stained_glass/stained_glass_pane/
    stained_hardened_clay file. So this is not a simple filename lookup
    like blocks.json was — it is the SAME missing metadata axis as the
    entry below. Item identity and block metadata are one task, not two:
    in vanilla a placeable block's ItemStack IS the block's (id, metadata)
    pair.
  current_hypothesis: >
    Building data/mc189/items.json needs an explicit (model filename or set
    of filenames) -> (legacy item name, metadata) mapping, not a bare name
    lookup — effectively blocked on the metadata/BlockState work below,
    since that work has to build the same (id, metadata) concept anyway.
  evidence: >
    Direct read of src/main/resources/version.json (confirms genuine 1.8.9
    asset provenance) and models/item/oak_door.json vs
    blockstates/wooden_door.json on this repo's own supplied assets, plus
    minecraft.wiki's pre-flattening Item IDs page for the correct legacy
    name/ID.
  vanilla_test_needed: >
    None further needed to confirm the mismatch exists; remaining work is
    design + implementation, tracked under the metadata entry below.
  owner: unassigned
  status: open

