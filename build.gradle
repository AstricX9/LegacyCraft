plugins {
    id 'java'
    id 'application'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.4'
}

dependencies {
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-openal:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"
    implementation 'com.google.code.gson:gson:2.11.0'

    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-openal:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

application {
    mainClass = 'net.minecraft.client.main.Main'
    // The launcher's profile "JVM Arguments" arrive in LEGACYCRAFT_JVM_ARGS.
    def launcherJvmArgs = System.getenv('LEGACYCRAFT_JVM_ARGS')
    applicationDefaultJvmArgs = launcherJvmArgs?.trim() ? launcherJvmArgs.trim().split(/\s+/).toList() : ['-Xms512m', '-Xmx2g']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def generatedGameData = layout.buildDirectory.dir('generated/resources/gameData')

sourceSets.main.resources.srcDir(generatedGameData)

/**
 * Expands the per-block authoring data into self-contained per-block and
 * per-item JSON files. Every 1.8.9 block has exactly one file in each of
 * data/mc189/block_data, block_states and block_items (organised 1:1 with the
 * block, like vanilla's one-blockstate-file-per-name assets). Block data
 * (definitions/blocks) and block states (states/blocks) are generated as
 * separate files and are never merged into one document. The generated
 * manifests are the sole authority for runtime IDs, so classpath/filesystem
 * enumeration order can never change persisted IDs.
 */
tasks.register('generateGameData') {
    def blockstates = file('src/main/resources/assets/minecraft/blockstates')
    def itemModels = file('src/main/resources/assets/minecraft/models/item')
    def definitions = file('src/main/resources/assets/legacycraft/definitions')
    def mc189 = file('data/mc189')
    inputs.dir(blockstates)
    inputs.dir(itemModels)
    inputs.dir(definitions)
    inputs.dir(mc189)
    outputs.dir(generatedGameData)

    doLast {
        def parser = new JsonSlurper()
        def outputRoot = generatedGameData.get().asFile
        delete(outputRoot)

        def readJson = { File source -> parser.parse(source, 'UTF-8') as Map }
        def readOverrides = { File directory ->
            def result = [:]
            if (directory.exists()) {
                directory.eachFileMatch(~/.*\.json/) { file ->
                    def value = readJson(file)
                    result[value.name as String] = value
                }
            }
            result
        }
        def writeJson = { File target, Object value ->
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + System.lineSeparator(), 'UTF-8')
        }
        def generatedPath = { String kind, String name ->
            def split = name.split(':', 2)
            "legacycraft:${kind}/${split[0]}/${split[1]}.json"
        }
        def writeGenerated = { String location, Object value ->
            writeJson(new File(outputRoot, "assets/legacycraft/${location.substring(location.indexOf(':') + 1)}"), value)
        }

        // Block IDs are sourced from the vanilla 1.8.9 legacy ID table
        // (data/mc189/blocks.json; see docs/compat/verified_facts.md and
        // docs/compat/deviations.yml DEV-002) rather than filesystem/classpath
        // discovery order, so persisted/networked IDs can eventually agree with
        // real vanilla data instead of only being internally self-consistent.
        def legacyTable = readJson(new File(mc189, 'blocks.json'))
        def legacyEntries = legacyTable.entries.toSorted { a, b -> (a.id as int) <=> (b.id as int) }
        def legacyIndex = [:]
        legacyEntries.eachWithIndex { entry, index ->
            String name = entry.name
            if ((entry.id as int) != index || legacyIndex.containsKey(name)) {
                throw new GradleException("Invalid legacy block table: expected unique block ID ${index}, found ${entry}")
            }
            legacyIndex[name] = index
        }
        if (legacyIndex['minecraft:air'] != 0) {
            throw new GradleException('The legacy block table must start with minecraft:air at ID 0')
        }
        def blockNames = new ArrayList(legacyIndex.keySet())

        // One file per block in each folder: none missing, none extra.
        def perBlock = { String folder ->
            def directory = new File(mc189, folder)
            def files = [:]
            directory.eachFileMatch(~/.*\.json/) { file -> files['minecraft:' + file.name[0..<-5]] = file }
            def extra = files.keySet().findAll { !legacyIndex.containsKey(it) }
            def missing = blockNames.findAll { !files.containsKey(it) }
            if (extra) throw new GradleException("data/mc189/${folder} has files for non-1.8.9 blocks: ${extra}")
            if (missing) throw new GradleException("data/mc189/${folder} is missing files for: ${missing}")
            files.collectEntries { name, file -> [(name): readJson(file)] }
        }

        // Block data and block states are kept apart; each side only accepts
        // its own keys so the two can never drift back into one document.
        def dataKeys = ['class', 'doubleSlab', 'fruit', 'material', 'hardness', 'opaque', 'fullCube', 'solid', 'translucent',
                        'renderType', 'cullSame', 'tintColor', 'lightLevel', 'lightOpacity', 'useNeighborBrightness', 'model', 'bounds',
                        'collision', 'targetable'] as Set
        def stateKeys = ['properties', 'defaults', 'meta', 'model'] as Set
        def requireKeys = { String source, Map value, Set allowed ->
            def unknown = value.keySet().findAll { !allowed.contains(it) }
            if (unknown) throw new GradleException("${source} has keys ${unknown} that do not belong there (allowed: ${allowed})")
        }

        def blockDefaults = readJson(new File(mc189, 'block_defaults.json'))
        requireKeys('data/mc189/block_defaults.json', blockDefaults, dataKeys)
        def blockData = perBlock('block_data')
        def blockStates = perBlock('block_states')
        def blockItems = perBlock('block_items')
        def stateTemplates = [:]
        new File(mc189, 'state_templates').eachFileMatch(~/.*\.json/) { file ->
            def template = readJson(file)
            requireKeys("data/mc189/state_templates/${file.name}", template, stateKeys)
            stateTemplates[file.name[0..<-5]] = template
        }
        blockData.each { name, value -> requireKeys("data/mc189/block_data ${name}", value as Map, dataKeys) }

        def blockEntries = []
        blockNames.eachWithIndex { name, index ->
            def value = new LinkedHashMap(blockDefaults)
            value.putAll(blockData[name])
            value.name = name
            value.index = index
            def location = generatedPath('definitions/blocks', name)
            writeGenerated(location, value)
            def entry = [index: index, name: name, definition: location]

            def source = blockStates[name] as Map
            requireKeys("data/mc189/block_states ${name}", source, stateKeys + ['template'] as Set)
            def states = [:]
            if (source.template) {
                def template = stateTemplates[source.template]
                if (template == null) throw new GradleException("${name} uses unknown state template ${source.template}")
                states.putAll(template as Map)
            }
            source.each { key, stateValue -> if (key != 'template') states[key] = stateValue }
            if (states) {
                def statesLocation = generatedPath('states/blocks', name)
                writeGenerated(statesLocation, [name: name] + states)
                entry.states = statesLocation
            }
            blockEntries << entry
        }
        writeJson(new File(outputRoot, 'assets/legacycraft/indexes/blocks.json'),
            [format: 1, count: blockEntries.size(), entries: blockEntries])

        def itemDefaults = readJson(new File(definitions, 'item_defaults.json'))
        def itemOverrides = readOverrides(new File(definitions, 'items'))
        // Model states that are not items of their own in 1.8.9 (the drawn bow, the cast
        // rod): their models stay for the renderer, but they get no registry entry.
        def modelStates = ['bow_pulling_0', 'bow_pulling_1', 'bow_pulling_2', 'fishing_rod_cast'] as Set
        def itemNames = itemModels.listFiles({ f -> f.name.endsWith('.json') } as FileFilter)
            .collect { it.name[0..<-5] }
            .findAll { !modelStates.contains(it) }
            .collect { 'minecraft:' + it }
            .toSorted()
        def itemNameSet = itemNames as Set

        // Which (block, metadata) each block item places, from each block's own
        // data/mc189/block_items file ({} = the block has no item).
        def placements = [:]
        blockNames.each { String blockName ->
            (blockItems[blockName] as Map).each { itemPath, meta ->
                String itemName = 'minecraft:' + itemPath
                if (!itemNameSet.contains(itemName)) throw new GradleException("${blockName} maps missing item model ${itemName}")
                if (placements.containsKey(itemName)) throw new GradleException("Item ${itemName} places more than one block")
                if ((meta as int) < 0 || (meta as int) > 15) throw new GradleException("Invalid placed metadata for ${itemName}")
                placements[itemName] = [block: blockName, meta: meta as int]
            }
        }

        def itemEntries = []
        itemNames.eachWithIndex { name, index ->
            def value = new LinkedHashMap(itemDefaults)
            value.putAll(itemOverrides[name] ?: [:])
            value.name = name
            value.index = index
            value.model = value.model ?: "minecraft:item/${name.substring(name.indexOf(':') + 1)}"
            if (!value.placeBlock && placements.containsKey(name)) {
                value.placeBlock = placements[name].block
                value.placeMeta = placements[name].meta
            }
            def location = generatedPath('definitions/items', name)
            writeGenerated(location, value)
            itemEntries << [index: index, name: name, definition: location]
        }
        writeJson(new File(outputRoot, 'assets/legacycraft/indexes/items.json'),
            [format: 1, count: itemEntries.size(), entries: itemEntries])

        // Biomes: one authored file per biome, same shape as the block data.
        def biomeKeys = ['id', 'temperature', 'rainfall', 'depth', 'scale', 'topBlock', 'topMetadata', 'fillerBlock',
                         'fillerMetadata', 'snow', 'rain', 'grassColor', 'foliageColor', 'grassMix', 'waterColor',
                         'treesPerChunk', 'grassPerChunk', 'flowersPerChunk', 'cactiPerChunk', 'mushroomsPerChunk'] as Set
        def biomeEntries = []
        def biomeIds = [:]
        new File(mc189, 'biomes').listFiles({ f -> f.name.endsWith('.json') } as FileFilter).toSorted { it.name }.each { file ->
            def value = readJson(file)
            String name = 'minecraft:' + file.name[0..<-5]
            requireKeys("data/mc189/biomes/${file.name}", value, biomeKeys)
            int id = value.id as int
            if (id < 0 || id > 255) throw new GradleException("Biome ${name} has an out-of-range ID ${id}")
            if (biomeIds.containsKey(id)) throw new GradleException("Biome ID ${id} is used by both ${biomeIds[id]} and ${name}")
            biomeIds[id] = name
            def definition = new LinkedHashMap(value)
            definition.name = name
            def location = generatedPath('definitions/biomes', name)
            writeGenerated(location, definition)
            biomeEntries << [id: id, name: name, definition: location]
        }
        biomeEntries = biomeEntries.toSorted { it.id }
        writeJson(new File(outputRoot, 'assets/legacycraft/indexes/biomes.json'),
            [format: 1, count: biomeEntries.size(), entries: biomeEntries])
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('generateGameData'))
}

// Tests: see docs/TESTING.md. `gradlew test` runs the fast suite; `gradlew oracleTest`
// runs the @Oracle comparisons against a real 1.8.9 world (-Dlegacycraft.vanillaWorld=<folder>).
tasks.withType(Test).configureEach {
    maxHeapSize = '1500m'
    // Let -Dlegacycraft.* reach the tests (the vanilla world path).
    System.properties.each { key, value ->
        if (key.toString().startsWith('legacycraft.')) systemProperty(key.toString(), value)
    }
}

test {
    useJUnitPlatform {
        excludeTags 'oracle'
    }
}

tasks.register('oracleTest', Test) {
    description = 'Compares LegacyCraft with a real 1.8.9 world (the @Oracle tests).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'oracle'
    }
    shouldRunAfter test
}
