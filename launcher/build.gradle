plugins {
    id 'application'
}

group = 'net.legacycraft'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'net.legacycraft.launcher.LauncherApp'
}

// The Additions list is the game's; a copy goes with the launcher for when it can't find the LegacyCraft folder.
processResources {
    from('../src/main/resources/assets/legacycraft/additions.json') {
        into 'net/legacycraft/launcher'
    }
}
