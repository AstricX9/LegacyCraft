plugins {
    id 'application'
}

group = 'net.legacycraft'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'net.legacycraft.launcher.LauncherApp'
}

distributions {
    main {
        contents { from('../additions') { exclude '**/build/**'; into 'additions' } }
    }
}

// The Additions are the game's; a copy goes with the launcher for when it can't find the LegacyCraft folder.
processResources {
    from('../additions') {
        include '*.json'
        into 'additions'
    }
}

// Standalone launcher builds its own modules against the public launcher API.
def launcherAdditionBuilds = []
fileTree('../additions') { include '*.json'; exclude '_*' }.files.sort().each { manifest ->
    def definition = new groovy.json.JsonSlurper().parse(manifest, 'UTF-8')
    if (definition.scope != 'launcher' || !definition.entrypoint || !definition.code) return
    String id = definition.id
    if (!(id ==~ /[A-Za-z0-9_-]+/)) throw new GradleException("Invalid addition ID: ${id}")
    def moduleSources = fileTree("../additions/${id}/src/main/java") { include '**/*.java' }
    // A prebuilt third-party mod must never be overwritten with an empty JAR.
    if (moduleSources.isEmpty()) return
    def moduleRoot = file("../additions").canonicalFile.toPath()
    if (!file("../additions/${definition.code}").canonicalFile.toPath().startsWith(moduleRoot))
        throw new GradleException("Addition JAR must stay inside additions/: ${id}")
    def output = layout.buildDirectory.dir("addition-classes/${id}")
    def compile = tasks.register("compileAddition${id.capitalize()}", JavaCompile) {
        dependsOn classes
        source = fileTree("../additions/${id}/src/main/java") { include '**/*.java' }
        classpath = sourceSets.main.output
        destinationDirectory = output
        javaCompiler = javaToolchains.compilerFor(java.toolchain)
        options.encoding = 'UTF-8'
    }
    launcherAdditionBuilds << tasks.register("buildAddition${id.capitalize()}", Jar) {
        dependsOn compile
        archiveFileName = new File(definition.code as String).name
        destinationDirectory = file("../additions/${definition.code}").parentFile
        from(compile)
        from("../additions/${id}/src/main/resources")
    }
}
tasks.register('buildAdditions') { dependsOn launcherAdditionBuilds }
tasks.named('run') { dependsOn 'buildAdditions' }
tasks.named('installDist') { dependsOn 'buildAdditions' }
tasks.named('distZip') { dependsOn 'buildAdditions' }
tasks.named('distTar') { dependsOn 'buildAdditions' }
